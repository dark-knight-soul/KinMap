<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="KinMap">
  <!-- Логотип KinMap: семейное дерево — родоначальник внизу, ветви к детям и внукам -->
  <defs>
    <linearGradient id="km-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fa173"/>
      <stop offset="1" stop-color="#1f5f43"/>
    </linearGradient>
    <linearGradient id="km-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#km-bg)"/>
  <rect width="128" height="128" rx="30" fill="url(#km-shine)"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="6">
    <!-- Ствол и ветви -->
    <path d="M64 98 V78"/>
    <path d="M64 78 C64 66 50 64 40 58"/>
    <path d="M64 78 C64 66 78 64 88 58"/>
    <path d="M40 58 C34 50 30 44 28 36" stroke-width="4.5"/>
    <path d="M40 58 C44 50 48 44 52 34" stroke-width="4.5"/>
    <path d="M88 58 C84 50 80 44 76 34" stroke-width="4.5"/>
    <path d="M88 58 C94 50 98 44 100 36" stroke-width="4.5"/>
  </g>
  <!-- Люди: корень, дети, внуки -->
  <g fill="#fff">
    <circle cx="64" cy="100" r="11"/>
    <circle cx="40" cy="58" r="9"/>
    <circle cx="88" cy="58" r="9"/>
    <circle cx="28" cy="32" r="7"/>
    <circle cx="52" cy="30" r="7"/>
    <circle cx="76" cy="30" r="7"/>
    <circle cx="100" cy="32" r="7"/>
  </g>
  <!-- Листок — «живое» древо -->
  <path d="M100 32 c8 -10 18 -10 20 -8 c-2 10 -10 14 -20 8 z" fill="#a8e6c1"/>
</svg>
